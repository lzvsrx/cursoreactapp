name: Verify projects
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [lzdev, portfolio-lzdev/web, portfolio-lzdev, react-native-bat-pass-generator, react-native-bat-sinal, trilha-react-native-components, trilha-react-native-expo-events, trilha-react-native-flexbox, trilha-react-native-green-latern-app, trilha-react-native-hooks]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - if: matrix.project == 'lzdev' || matrix.project == 'portfolio-lzdev/web'
        run: npm run build && npm test && npm run test:api
      - if: matrix.project != 'lzdev' && matrix.project != 'portfolio-lzdev/web'
        run: npm run doctor && npx expo export --platform all
      - if: matrix.project == 'react-native-bat-sinal' || matrix.project == 'trilha-react-native-hooks'
        run: npm test
      - name: Report dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
